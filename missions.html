<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Missions</title>
<meta name="description" content="You have two missions for this wedding; spy on others and prove how much you know about us.">
<meta name="theme-color" content="#faf1e4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1b1210" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="assets/img/eyes.png">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<a class="skip" href="#main">Skip to Content</a>

<header class="site-head">
  <div class="site-head__in">
    <a class="brand" href="index.html">
      <img class="brand__logo" src="assets/img/logo.png" alt="" width="720" height="676">
      Thangamey
    </a>
    <nav class="nav" aria-label="Main">
      <a href="index.html">Home</a>
      <a href="travel.html">Travel &amp; Stay</a>
      <a href="events.html">Events</a>
      <a href="gifts.html">Gift Registry</a>
    </nav>
  </div>
</header>

<main id="main">
  <!-- No painted band: the page opens on the bar naming the two missions,
       which is all it gives away before the window opens. -->
  <h1 class="vh">Two Missions</h1>

  <!-- Written out here rather than built in JavaScript: the names are the
       page's whole content before the window opens, and a bar that needs a
       script to say anything is an empty strip if that script is slow, stale
       or blocked. JS only turns them into links once the missions are open. -->
  <nav class="event-jump" id="mission-bar" aria-label="The two missions">
    <span data-mission="i-spy">I Spy</span>
    <span data-mission="gather-intel">Gather Intel</span>
  </nav>

  <!-- Before the window opens this is the whole page. See `games` in
       data/config.js. -->
  <section class="section shell" id="game-gate" hidden>
    <div class="callout">
      <p><strong>No, not yet.</strong> </p>
      <p>That is all you get for now. Go and <a href="travel.html#plans">tell us your
      plans</a> instead.</p>
    </div>
  </section>

  <!-- Open only inside the window. Each mission is one Google Form, so the
       page's job is to name it and hand over the link. -->
  <div id="game" hidden>
    <section class="section shell">
      <p class="lede" id="missions-intro"></p>
      <ul class="grid grid--2 mission-cards" id="mission-cards"></ul>
    </section>

    <!-- The rules, in the same box the registry signs off in. -->
    <section class="section shell section--rule">
      <div class="callout">
        <p id="missions-close"></p>
      </div>
    </section>
  </div>

</main>

<footer class="site-foot">
  <div class="shell site-foot__in">
    <p>Akanksha &amp; Prateek &middot; <span data-cfg="mainDateLabel"></span> &middot; <span data-cfg="mainCityLabel"></span></p>
    <p><a data-contact="email">Email</a> &middot; <a data-contact="whatsapp">WhatsApp</a></p>
  </div>
</footer>

<script src="data/config.js"></script>
<script src="assets/js/site.js"></script>
</body>
</html>
