<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Missions</title>
<meta name="description" content="Two missions for the wedding: ten photographs to find, and ten questions about Akanksha and Prateek.">
<meta name="theme-color" content="#07173a">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="assets/img/eyes.png">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>

<header class="site-head">
  <div class="site-head__in">
    <a class="brand" href="index.html">
      <img class="brand__logo" src="assets/img/logo.png" alt="" width="720" height="676">
      Thangamey <em class="script" data-cfg="couple.script"></em>
    </a>
    <nav class="nav" aria-label="Main">
      <a href="index.html">Home</a>
      <a href="travel.html">Travel &amp; Stay</a>
      <a href="events.html">Events</a>
      <a href="gifts.html">Gift Registry</a>
    </nav>
  </div>
</header>

<main id="main">
  <section class="sky sky--band sky--scrim" data-sky="tints-of-sunflower" data-art="assets/art/haldi.jpg">
    <div class="sky__in">
      <p class="eyebrow">8 &amp; 9 December &middot; Puri</p>
      <h1 id="missions-heading">Two missions</h1>
      <p class="lede" id="missions-intro"></p>
    </div>
  </section>

  <!-- Before the window opens this is the whole page: the two names, when
       they open, and nothing else. See `games` in data/config.js. -->
  <section class="section shell" id="game-gate" hidden>
    <ul class="mission-names">
      <li><span class="mission-names__no">Mission one</span>
          <span class="mission-names__name" id="gate-name-one"></span></li>
      <li><span class="mission-names__no">Mission two</span>
          <span class="mission-names__name" id="gate-name-two"></span></li>
    </ul>
    <div class="callout">
      <p><strong>Not yet.</strong> <span id="game-open-label"></span></p>
      <p>That is all you get for now. Go and <a href="travel.html#plans">tell us your
      plans</a> instead.</p>
    </div>
  </section>

  <!-- Open only inside the window. Each mission is one Google Form, so the
       page's job is to name it and hand over the link. -->
  <div id="game" hidden>
    <section class="section shell">
      <ul class="grid grid--2 mission-cards" id="mission-cards"></ul>
      <p class="mission-aside" id="missions-close"></p>
    </section>
  </div>
</main>

<footer class="site-foot">
  <div class="shell site-foot__in">
    <p>Akanksha &amp; Prateek &middot; <span data-cfg="mainDateLabel"></span> &middot; <span data-cfg="mainCityLabel"></span></p>
    <p><a data-contact="email">email us</a> &middot; <a data-contact="whatsapp">WhatsApp</a></p>
    <p class="tag script" data-cfg="couple.script"></p>
  </div>
</footer>

<script src="data/config.js"></script>
<script src="assets/js/site.js"></script>
</body>
</html>
