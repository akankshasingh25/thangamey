<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Akanksha &amp; Prateek</title>
<meta name="description" content="Akanksha and Prateek are getting married in Puri on 8 and 9 December 2026. Four events, two days, one coast. Where to stay, how to get there, and the gift registry.">
<meta name="theme-color" content="#07173a">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="assets/img/eyes.png">
<link rel="apple-touch-icon" href="assets/img/logo.png">
<meta property="og:title" content="Thangamey, The Weeding">
<meta property="og:description" content="Akanksha &amp; Prateek · Puri · 8–9 December 2026">
<meta property="og:image" content="assets/art/cover.jpg">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>

<header class="site-head">
  <div class="site-head__in">
    <a class="brand" href="index.html">
      <img class="brand__logo" src="assets/img/logo.png" alt="" width="720" height="676">
      Thangamey <em class="script" data-cfg="couple.script"></em>
    </a>
    <nav class="nav" aria-label="Main">
      <a href="index.html">Home</a>
      <a href="events.html">Events</a>
      <a href="gifts.html">Gift Registry</a>
      <a href="travel.html">Travel &amp; Stay</a>
    </nav>
  </div>
</header>

<main id="main">

  <!-- ---------- hero: the postcard cover ---------- -->
  <section class="sky sky--scrim hero" id="hero-cover" data-sky="puri-night" data-art="assets/art/cover.jpg">
    <div class="sky__in hero__in">
      <div class="hero__text">
        <h1 class="vh">Akanksha &amp; Prateek</h1>
        <img class="hero__names" src="assets/img/names.png"
             alt="Akanksha &amp; Prateek" width="660" height="389" fetchpriority="high" decoding="async">
        <p class="hero__meta">
          <span data-cfg="mainDateLabel"></span>
          <span data-cfg="mainCityLabel"></span>
        </p>
        <p class="hero__tag" data-cfg="couple.tagline"></p>
        <div class="count" id="countdown" aria-live="off"></div>
      </div>
      <figure class="postcard postcard--hero">
        <img src="assets/art/cover.jpg" width="647" height="1150"
             alt="The first page of the invitation: a painted night sky swirling over canal houses, with animals in a field of colour below"
             fetchpriority="high" decoding="async">
      </figure>
    </div>
  </section>

  <!-- ---------- the story ---------- -->
  <section class="section shell">
    <div class="section__head">
      <p class="eyebrow">Us, apparently</p>
      <h2 data-cfg="story.heading"></h2>
    </div>
    <div id="story-body" class="lede"></div>
  </section>

  <!-- ---------- the logo, and where it came from ---------- -->
  <section class="section section--rule shell">
    <div class="media-block media-block--logo" id="logo-block"></div>
  </section>

  <!-- ---------- save the date ---------- -->
  <section class="section section--rule shell">
    <div class="media-block" id="video-block"></div>
  </section>

  <!-- ---------- sustainability ---------- -->
  <!-- <section class="section section--rule shell">
    <div class="section__head">
      <p class="eyebrow">A lighter wedding</p>
      <h2>Big party, small footprint</h2>
      <p class="lede" data-cfg="sustainable.intro"></p>
    </div>
    <ul class="ticks grid grid--2" id="sustain-list"></ul>
  </section> -->

  <!-- ---------- ask us ---------- -->
  <section class="section section--rule shell">
    <img class="eyes" src="assets/img/eyes.png" alt="" width="100" height="62" loading="lazy">
    <div class="section__head" style="margin-bottom:1.2rem">
      <h2>Ask us anything</h2>
      <p class="lede" data-cfg="contact.helpText"></p>
    </div>
    <p class="btn-row" style="justify-content:flex-start">
      <a class="btn btn--gold" data-contact="email" data-contact-label>Email us</a>
      <a class="btn btn--ghost" data-contact="whatsapp" data-contact-label>WhatsApp</a>
    </p>
  </section>

</main>

<footer class="site-foot">
  <div class="shell site-foot__in">
    <p>Akanksha &amp; Prateek &middot; <span data-cfg="mainDateLabel"></span> &middot; <span data-cfg="mainCityLabel"></span></p>
    <p><a data-contact="email">email us</a> &middot; <a data-contact="whatsapp">WhatsApp</a></p>
    <p class="tag script" data-cfg="couple.script"></p>
  </div>
</footer>

<script src="data/config.js"></script>
<script src="assets/js/site.js"></script>
</body>
</html>
